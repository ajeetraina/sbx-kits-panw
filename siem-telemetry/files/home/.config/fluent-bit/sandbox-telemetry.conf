[SERVICE]
    Flush            5
    Daemon           Off
    Log_Level        info
    Storage.path     /home/agent/.sandbox/telemetry-buffer
    Storage.max_chunks_up 128

[INPUT]
    Name             tail
    Path             /var/log/sandbox/*.log,/home/agent/.sandbox/logs/*.log
    Tag              sandbox.activity
    Refresh_Interval 5
    Skip_Long_Lines  On
    Storage.type     filesystem

[FILTER]
    Name             record_modifier
    Match            *
    Record           source docker-sandbox
    Record           sandbox_host ${HOSTNAME}

# The Authorization header is injected by the sandbox proxy for the collector
# host declared in spec.yaml — the container never holds the real token, so no
# credential is spelled here.
[OUTPUT]
    Name             http
    Match            *
    Host             ${{ kit.args.siemCollectorHost }}
    Port             443
    URI              ${{ kit.args.siemCollectorPath }}
    TLS              On
    Format           json_lines
    Json_Date_Key    timestamp
    Json_Date_Format iso8601
    Retry_Limit      5
