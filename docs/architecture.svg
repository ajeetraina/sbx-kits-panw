<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="640" viewBox="0 0 1240 640" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a94a6"/>
    </marker>
    <marker id="arrowDash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9aa3af"/>
    </marker>
    <marker id="arrowEnf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/>
    </marker>
  </defs>

  <rect width="1240" height="640" fill="#ffffff"/>

  <!-- Host machine -->
  <rect x="30" y="50" width="950" height="560" rx="26" fill="#e9f1fc" stroke="#7aa7e0" stroke-width="2.5"/>
  <text x="64" y="588" fill="#1e4fa3" font-size="21" font-weight="700">Host machine</text>

  <!-- microVM sandbox -->
  <rect x="72" y="112" width="300" height="356" rx="13" fill="#ffffff" stroke="#6b7787" stroke-width="2"/>
  <text x="92" y="143" fill="#1f2937" font-size="18" font-weight="700">microVM sandbox</text>
  <text x="352" y="143" text-anchor="end" fill="#8a94a6" font-size="13">container</text>

  <!-- container dashed box -->
  <rect x="92" y="156" width="260" height="300" rx="9" fill="none" stroke="#9aa3af" stroke-width="1.5" stroke-dasharray="5 4"/>

  <!-- Agent -->
  <rect x="108" y="170" width="228" height="52" rx="7" fill="#ffffff" stroke="#cfd6df" stroke-width="1.5"/>
  <text x="222" y="203" text-anchor="middle" fill="#2f6fdb" font-size="16" font-weight="700">Agent (any)</text>

  <!-- endpoint-enforcement mixin -->
  <rect x="108" y="236" width="228" height="66" rx="7" fill="#ffffff" stroke="#cfd6df" stroke-width="1.5"/>
  <text x="222" y="265" text-anchor="middle" fill="#c2410c" font-size="15" font-weight="700">endpoint-enforcement</text>
  <text x="222" y="286" text-anchor="middle" fill="#6b7280" font-size="12">marker &#183; kind: mixin</text>

  <!-- siem-telemetry mixin -->
  <rect x="108" y="316" width="228" height="66" rx="7" fill="#ffffff" stroke="#cfd6df" stroke-width="1.5"/>
  <text x="222" y="345" text-anchor="middle" fill="#2f6fdb" font-size="15" font-weight="700">siem-telemetry</text>
  <text x="222" y="366" text-anchor="middle" fill="#6b7280" font-size="12">Fluent Bit &#183; kind: mixin</text>

  <!-- token sentinel -->
  <rect x="108" y="396" width="228" height="52" rx="9" fill="#ece7dd" stroke="#d8cfc0" stroke-width="1.5"/>
  <text x="222" y="418" text-anchor="middle" fill="#6b6255" font-size="12.5" font-weight="600" font-family="'SF Mono', Menlo, monospace">SIEM_COLLECTOR_TOKEN</text>
  <text x="222" y="437" text-anchor="middle" fill="#8a8272" font-size="12.5">= proxy-managed</text>

  <!-- Endpoint security agent (host policy) -->
  <rect x="452" y="170" width="232" height="88" rx="9" fill="#fdf0e6" stroke="#e6a877" stroke-width="2"/>
  <text x="568" y="199" text-anchor="middle" fill="#c2410c" font-size="15" font-weight="700">Endpoint security agent</text>
  <text x="568" y="221" text-anchor="middle" fill="#9a5a33" font-size="12">host-side policy engine</text>
  <text x="568" y="241" text-anchor="middle" fill="#9a5a33" font-size="12">permit only sandbox-wrapped</text>

  <!-- endpoint agent -> agent (attest) -->
  <line x1="452" y1="206" x2="374" y2="206" stroke="#c2410c" stroke-width="2" marker-end="url(#arrowEnf)"/>
  <text x="413" y="197" text-anchor="middle" fill="#c2410c" font-size="10.5">attest marker</text>

  <!-- Secret store -->
  <rect x="452" y="282" width="232" height="64" rx="9" fill="#ffffff" stroke="#cfd6df" stroke-width="1.5"/>
  <text x="568" y="310" text-anchor="middle" fill="#1f2937" font-size="16" font-weight="700">Secret store</text>
  <text x="568" y="330" text-anchor="middle" fill="#6b7280" font-size="12">sbx secret set-custom</text>

  <!-- secret store -> proxy -->
  <line x1="568" y1="346" x2="568" y2="368" stroke="#8a94a6" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- sbx proxy -->
  <rect x="452" y="370" width="232" height="88" rx="9" fill="#d9f2e4" stroke="#86d6ab" stroke-width="2"/>
  <text x="568" y="406" text-anchor="middle" fill="#1f9d63" font-size="17" font-weight="700">sbx proxy</text>
  <text x="568" y="429" text-anchor="middle" fill="#1f9d63" font-size="13">swaps in token</text>

  <!-- proxy -> egress -->
  <line x1="568" y1="458" x2="568" y2="480" stroke="#8a94a6" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Egress policy -->
  <rect x="452" y="482" width="232" height="64" rx="9" fill="#ffffff" stroke="#cfd6df" stroke-width="1.5"/>
  <text x="568" y="510" text-anchor="middle" fill="#1f2937" font-size="16" font-weight="700">Egress policy</text>
  <text x="568" y="530" text-anchor="middle" fill="#6b7280" font-size="12.5">allow-list</text>

  <!-- siem-telemetry -> proxy (ship logs) -->
  <line x1="336" y1="349" x2="448" y2="400" stroke="#8a94a6" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="402" y="366" text-anchor="middle" fill="#6b7280" font-size="11">ship logs</text>

  <!-- proxy -> SIEM collector -->
  <line x1="684" y1="406" x2="1006" y2="380" stroke="#9aa3af" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrowDash)"/>
  <text x="845" y="376" text-anchor="middle" fill="#6b7280" font-size="11">POST JSON events</text>
  <text x="845" y="392" text-anchor="middle" fill="#6b7280" font-size="10">token injected</text>

  <!-- egress -> registries -->
  <line x1="684" y1="514" x2="1006" y2="500" stroke="#9aa3af" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrowDash)"/>
  <text x="845" y="494" text-anchor="middle" fill="#6b7280" font-size="10">install-time only</text>

  <!-- SIEM HTTP collector (external) -->
  <rect x="1010" y="344" width="200" height="82" rx="9" fill="#ffffff" stroke="#cfd6df" stroke-width="1.5"/>
  <text x="1110" y="377" text-anchor="middle" fill="#4338ca" font-size="15" font-weight="700">SIEM HTTP collector</text>
  <text x="1110" y="400" text-anchor="middle" fill="#6b7280" font-size="12.5">event ingest endpoint</text>

  <!-- Registries (external) -->
  <rect x="1010" y="470" width="200" height="66" rx="9" fill="#ffffff" stroke="#cfd6df" stroke-width="1.5"/>
  <text x="1110" y="500" text-anchor="middle" fill="#1f2937" font-size="15" font-weight="700">Package registries</text>
  <text x="1110" y="522" text-anchor="middle" fill="#6b7280" font-size="12.5">apt &#183; pip &#183; npm</text>

  <!-- caption -->
  <text x="1010" y="566" fill="#1e4fa3" font-size="15" font-weight="700">Collector token never</text>
  <text x="1010" y="586" fill="#1e4fa3" font-size="15" font-weight="700">enters the sandbox</text>
  <text x="1010" y="608" fill="#3b7fd6" font-size="12">Proxy swaps it in at the boundary</text>
</svg>
